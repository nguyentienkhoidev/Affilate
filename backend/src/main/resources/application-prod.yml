# =============================================================================
# HeyGoodly Affiliate & Editorial Reviews Portal — Production Profile (prod)
# Activated automatically in Docker via: SPRING_PROFILES_ACTIVE=prod
# =============================================================================

spring:
  # ===========================================================================
  # 1. PostgreSQL 16 & HikariCP Production Pool Tuning
  # ===========================================================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:heygoodly_db}
    username: ${DB_USER:heygoodly_user}
    password: ${DB_PASSWORD:heygoodly_secret_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HeyGoodlyProdHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:20000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}

  # ===========================================================================
  # 2. JPA & Hibernate Production Hardening (Liquibase-First, Zero OSIV)
  # ===========================================================================
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ===========================================================================
  # 3. Liquibase Migration Safety (Never drop schema in production)
  # ===========================================================================
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false

  # ===========================================================================
  # 4. Redis 7 High-Throughput Redirects & Write-Behind Counters
  # ===========================================================================
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:heygoodly_redis_pass_2026}
      timeout: ${REDIS_TIMEOUT_MS:3000}ms
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:3000}ms
      repositories:
        enabled: false

  # ===========================================================================
  # 5. Graceful Rolling Deployment Shutdown
  # ===========================================================================
  lifecycle:
    timeout-per-shutdown-phase: 30s

# =============================================================================
# 6. Embedded Tomcat, Reverse Proxy (Nginx / Cloudflare) & Error Sanitization
# =============================================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
  error:
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    include-message: always

# =============================================================================
# 7. Application Production Defaults (Override via .env in Production)
# =============================================================================
app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:heygoodly_minio_admin}
    secret-key: ${MINIO_SECRET_KEY:heygoodly_minio_pass_2026}
    bucket-name: ${MINIO_BUCKET_NAME:heygoodly-media}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://heygoodly.com,https://www.heygoodly.com}
  affiliate:
    default-fallback-url: ${AFFILIATE_DEFAULT_FALLBACK_URL:https://heygoodly.com}

# =============================================================================
# 8. Production Logging (Clean stdout for Docker / Loki / CloudWatch)
# =============================================================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} : %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO
    com.heygoodly.portal: ${LOG_LEVEL_APP:INFO}

