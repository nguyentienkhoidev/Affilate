spring:
  application:
    name: bargorya-portal-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlX2JhcmdvcnlhX2FmZmlsaWF0ZV9wb3J0YWxfand0X3NlY3JldF9rZXlfMjAyNg==}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  storage:
    local-path: ${STORAGE_LOCAL_PATH:/var/www/bargorya/uploads}
    max-file-size-bytes: 10485760 # 10MB
    allowed-image-extensions: jpg,jpeg,png,webp
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  two-factor:
    issuer: BargoryaProCMS
