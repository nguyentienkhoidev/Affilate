name: ${APP_SLUG:-heygoodly}

services:
  # ===========================================================================
  # 1. PostgreSQL 16 - Relational Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ${APP_SLUG:-heygoodly}-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heygoodly_db}
      POSTGRES_USER: ${POSTGRES_USER:-heygoodly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heygoodly_secret_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heygoodly_user} -d ${POSTGRES_DB:-heygoodly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 2. Redis 7 - In-Memory Cache & High-Throughput Redirects
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ${APP_SLUG:-heygoodly}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-heygoodly_redis_pass_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-heygoodly_redis_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 3. MinIO - S3 Object Storage
  # ===========================================================================
  minio:
    image: elestio/minio:latest
    container_name: ${APP_SLUG:-heygoodly}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-heygoodly_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-heygoodly_minio_pass_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Automated bucket creation for MinIO
  create-bucket:
    image: elestio/minio:latest
    container_name: ${APP_SLUG:-heygoodly}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-heygoodly_minio_admin} ${MINIO_ROOT_PASSWORD:-heygoodly_minio_pass_2026};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-heygoodly-media};
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET_NAME:-heygoodly-media};
      exit 0;
      "

  # ===========================================================================
  # 4. Spring Boot 3 Backend
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_SLUG:-heygoodly}-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx640m -XX:+UseG1GC}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-heygoodly_db}
      DB_USER: ${POSTGRES_USER:-heygoodly_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-heygoodly_secret_password_2026}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-heygoodly_redis_pass_2026}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-heygoodly_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-heygoodly_minio_pass_2026}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-heygoodly-media}
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlX2hleWdvb2RseV9hZmZpbGlhdGVfcG9ydGFsX2p3dF9zZWNyZXRfa2V5XzIwMjY=}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-86400000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-HeyGoodlyProCMS}
      AFFILIATE_DEFAULT_FALLBACK_URL: ${AFFILIATE_DEFAULT_FALLBACK_URL:-https://heygoodly.com}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ===========================================================================
  # 5. Next.js 16 Frontend
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: ${APP_SLUG:-heygoodly}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
    name: ${APP_SLUG:-heygoodly}_postgres_data
  redis_data:
    name: ${APP_SLUG:-heygoodly}_redis_data
  minio_data:
    name: ${APP_SLUG:-heygoodly}_minio_data
