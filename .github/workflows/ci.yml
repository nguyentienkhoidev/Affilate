name: HeyGoodly CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ===========================================================================
  # 1. Frontend Quality Gate (Next.js 16 + TypeScript + Tailwind)
  # ===========================================================================
  frontend-check:
    name: Frontend Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify TypeScript Validity (No-Emit)
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ===========================================================================
  # 2. Backend Quality Gate (Spring Boot 3 + Java 21)
  # ===========================================================================
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Run Backend Unit Tests
        working-directory: backend
        run: mvn clean test

      - name: Package Spring Boot Executable JAR
        working-directory: backend
        run: mvn package -DskipTests

  # ===========================================================================
  # 3. Docker Compose Configuration Verification
  # ===========================================================================
  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose Configs (Single-Site & Multi-Site Shared MinIO + Nginx)
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.minio.yml config --quiet
          docker compose -f docker-compose.nginx.yml config --quiet
          docker compose -f docker-compose.site.yml config --quiet

