# =============================================================================
# Shared Nginx Reverse Proxy Gateway (Run ONCE on the VPS for ALL Websites)
# Routes traffic by domain to web1, web2, ... and shared-minio!
# Prerequisite: docker compose -f docker-compose.minio.yml up -d
# Usage:        docker compose -f docker-compose.nginx.yml up -d
# =============================================================================
name: shared-gateway

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shared-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_SITE2_PORT:-81}:81"
      - "${NGINX_SITE3_PORT:-82}:82"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/certbot/www:/var/www/certbot:ro
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    networks:
      - shared-gateway-net
      - shared-minio-net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nginx_logs:
    name: shared_nginx_logs

networks:
  shared-gateway-net:
    name: shared-gateway-net
    driver: bridge
  shared-minio-net:
    external: true
    name: shared-minio-net

