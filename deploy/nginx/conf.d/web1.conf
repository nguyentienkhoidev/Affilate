# =============================================================================
# Site Config: web1
# - Works IMMEDIATELY with Server IP (http://<IP_SERVER>) via default_server!
# - When you have a domain, optionally replace "_" with "web1.com www.web1.com"
# =============================================================================
server {
    listen 80 default_server;
    server_name heygoodly.com www.heygoodly.com _;

    # Docker embedded DNS resolver so Nginx never crashes if web1 is restarting
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 1. Rate-limited Auth Endpoints (Login & 2FA protection)
    location ~ ^/api/v1/auth/(login|verify-2fa)$ {
        limit_req zone=auth_limit burst=10 nodelay;

        set $backend_upstream http://web1-backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # 2. Spring Boot REST APIs & Multipart Media Uploads -> web1-backend:8080
    location /api/ {
        client_max_body_size 25M;

        set $backend_upstream http://web1-backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 3. Shared MinIO Media Proxy (/media/<bucket>/<file> -> shared-minio:9000)
    # Allows serving MinIO images directly on Server IP without extra domain/port!
    location ~ ^/media/(.*)$ {
        set $minio_upstream http://shared-minio:9000/$1$is_args$args;
        proxy_pass $minio_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. Next.js Static Assets (Immutable 1-year cache)
    location /_next/static/ {
        set $frontend_upstream http://web1-frontend:3000;
        proxy_pass $frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. Next.js 16 SSR Client Portal, Admin ProCMS & Outbound Redirects (/go, /out)
    location / {
        set $frontend_upstream http://web1-frontend:3000;
        proxy_pass $frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
