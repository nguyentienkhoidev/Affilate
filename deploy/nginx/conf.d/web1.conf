# =============================================================================
# Site Config: web1 (Domain https://heygoodly.com + IP Fallback)
# =============================================================================

# 1. HTTP Server for Domain -> Redirect HTTP to Canonical HTTPS (keep ACME open)
server {
    listen 80;
    server_name heygoodly.com www.heygoodly.com;

    # Let's Encrypt Certbot ACME challenge & auto-renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://heygoodly.com$request_uri;
    }
}

# 2. HTTP Server Fallback for Raw Server IP
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ ^/api/v1/auth/(login|verify-2fa)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        set $backend_upstream http://web1-backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /api/ {
        client_max_body_size 25M;
        set $backend_upstream http://web1-backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location ~ ^/media/(.*)$ {
        set $minio_upstream http://shared-minio:9000/$1$is_args$args;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/static/ {
        set $frontend_upstream http://web1-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $frontend_upstream http://web1-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# 3. HTTPS www Redirect -> Canonical https://heygoodly.com
server {
    listen 443 ssl;
    http2 on;
    server_name www.heygoodly.com;

    ssl_certificate /etc/letsencrypt/live/heygoodly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heygoodly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://heygoodly.com$request_uri;
}

