# =============================================================================
# Shared MinIO Public Media Gateway (Change media.yourdomain.com to your domain)
# =============================================================================
server {
    listen 80;
    server_name media.yourdomain.com;

    # Docker embedded DNS resolver (allows Nginx to start even before MinIO)
    resolver 127.0.0.11 valid=10s ipv6=off;

    ignore_invalid_headers off;
    client_max_body_size 25M;
    proxy_buffering off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $minio_upstream http://shared-minio:9000;
        proxy_pass $minio_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Connection "";

        # Aggressive browser & Cloudflare CDN cache for WebP media assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

